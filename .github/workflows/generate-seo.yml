name: Generate SEO pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-seo.mjs'
      - 'course-info.js'
      - 'course-addresses.js'
      - 'facility-info.js'
      - 'bin-info.js'
      - 'database_sql/seed_expansion_*.sql'
      - 'course-routes.js'
      - 'course-photos.js'
      - 'scripts/import-course-photos.mjs'
      - 'scripts/convert-course-photo.py'
      - 'docs/walks-300-20261004/photo-downloads.json'
      - '.github/workflows/generate-seo.yml'
      - 'database_sql/seed_verified_walking_courses_*.sql'
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

concurrency:
  group: generate-seo-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install photo conversion library
        run: python3 -m pip install Pillow==12.3.0
      - name: Import verified course photographs
        run: node scripts/import-course-photos.mjs
      - name: Generate static search pages
        run: node scripts/generate-seo.mjs
      - name: Commit changed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses places bins guides with-dog discover.html sitemap.xml assets/course-photos course-photos.js
          if git diff --cached --quiet; then
            echo "No SEO page changes"
          else
            git commit -m "검색용 상세 페이지 자동 갱신"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
