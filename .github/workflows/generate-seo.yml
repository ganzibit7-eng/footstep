name: Generate SEO pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-seo.mjs'
      - '.github/workflows/generate-seo.yml'
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

concurrency:
  group: generate-seo-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate static search pages
        run: node scripts/generate-seo.mjs
      - name: Commit changed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses places bins discover.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No SEO page changes"
          else
            git commit -m "검색용 상세 페이지 자동 갱신"
            git push
          fi
