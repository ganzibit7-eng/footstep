name: Notify search engines after deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'weekend/**', 'share-link.js', 'courses/**', 'places/**', 'bins/**', 'guides/**', 'with-dog/**', 'sitemap.xml', 'walk-sitemap.xml', 'scripts/search-discovery.mjs', '.github/workflows/search-discovery.yml']
  workflow_run:
    workflows: ['pages build and deployment', 'Generate SEO pages', 'Refresh regional weather']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
concurrency:
  group: indexnow-main
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.workflow_run.name == 'Generate SEO pages' || github.event.workflow_run.name == 'Refresh regional weather') && 'main' || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Serialize publication and confirm the live commit
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PUBLICATION: ${{ github.event.workflow_run.name == 'Generate SEO pages' || github.event.workflow_run.name == 'Refresh regional weather' }}
        run: |
          if [ "$REQUEST_PUBLICATION" = "true" ]; then
            node scripts/pages-publication.mjs --request
          else
            node scripts/pages-publication.mjs
          fi
      - uses: actions/cache/restore@v4
        with:
          path: .search-state
          key: indexnow-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-main-
      - name: Validate sitemap pages and notify only changed public URLs
        if: steps.publish.outputs.current == 'true'
        run: |
          node --test tests/search-discovery.mjs
          node scripts/search-discovery.mjs --submit
      - uses: actions/cache/save@v4
        if: steps.publish.outputs.current == 'true'
        with:
          path: .search-state
          key: indexnow-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record result
        run: echo 'IndexNow receipt is not proof of indexing, ranking or visitor growth. Only changed public canonical pages are submitted.' >> "$GITHUB_STEP_SUMMARY"
