name: Refresh regional weather
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: ['scripts/refresh-weather.mjs', 'weather-widget.js', 'tests/weather-widget.cjs', '.github/workflows/refresh-weather.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: regional-weather
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/weather-widget.cjs
      - run: node --test tests/weather-snapshot.mjs
      - run: node scripts/refresh-weather.mjs
      - name: Publish only the public weather snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- data/weather.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public regional weather forecasts'
          git fetch origin main
          git rebase origin/main
          git push origin main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
