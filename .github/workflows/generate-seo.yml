name: Generate SEO pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-pet-life.mjs'
      - 'data/place-count-summary.json'
      - 'scripts/generate-pet-care.mjs'
      - 'scripts/generate-professional-pages.mjs'
      - 'data/pet-care/**'
      - 'pet-care*.js'
      - 'pet-care.css'
      - 'scripts/generate-seo.mjs'
      - 'scripts/guide-discovery.mjs'
      - 'tests/guide-topics.mjs'
      - 'scripts/discovery-layout.mjs'
      - 'scripts/hub-information-layout.mjs'
      - 'scripts/public-reading-layout.mjs'
      - 'scripts/trip-stays.mjs'
      - 'trip-stays.json'
      - 'scripts/refine-place-details.mjs'
      - 'scripts/detail-editorial.mjs'
      - 'scripts/listing-editorial.mjs'
      - 'scripts/place-card.mjs'
      - 'scripts/place-curation.mjs'
      - 'scripts/pet-highlights.mjs'
      - 'scripts/detail-trust.mjs'
      - 'scripts/listing-copy.mjs'
      - 'scripts/directory-data.mjs'
      - 'card-media.js'
      - 'card-media.css'
      - 'scripts/publish-control-polish.mjs'
      - 'ui-control-tokens.css'
      - 'scripts/place-recommendations.mjs'
      - 'place-presentation.js'
      - 'listing-editorial.css'
      - 'detail-editorial.css'
      - 'detail-editorial.js'
      - 'place-detail.css'
      - 'data/place-external-links.json'
      - 'tests/place-detail-layout.mjs'
      - 'tests/fixtures/place-detail-*.html'
      - 'scripts/weekend-guide.mjs'
      - 'scripts/search-snippet.mjs'
      - 'scripts/search-head.mjs'
      - 'scripts/sitemap-modified.mjs'
      - 'scripts/route-evidence-guides.mjs'
      - 'route-guides.css'
      - 'scripts/refine-regional-search.mjs'
      - 'regional-search.css'
      - 'scripts/search-style-cache.mjs'
      - 'scripts/image-sitemap.mjs'
      - 'scripts/generate-rss.mjs'
      - 'scripts/guide-discovery.mjs'
      - 'course-info.js'
      - 'course-pet-access.js'
      - 'course-comfort.js'
      - 'course-comfort.css'
      - 'course-addresses.js'
      - 'facility-info.js'
      - 'place-conditions.js'
      - 'place-photos.js'
      - 'place-evidence.js'
      - 'infrastructure/photo-delivery/**'
      - 'tests/photo-storage-guard.mjs'
      - 'tests/place-visit-info.cjs'
      - 'tests/place-photo-rights.cjs'
      - 'tests/place-cultural-data.cjs'
      - 'tests/helpers/place-photo-source.cjs'
      - 'bin-info.js'
      - 'database_sql/seed_expansion_*.sql'
      - 'database_sql/seed_expansion_*.sql.gz'
      - 'course-routes.js'
      - 'course-photos.js'
      - 'scripts/import-course-photos.mjs'
      - 'scripts/convert-course-photo.py'
      - 'docs/walks-300-20261004/photo-downloads.json'
      - '.github/workflows/generate-seo.yml'
      - 'database_sql/seed_verified_walking_courses_*.sql'
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

concurrency:
  group: generate-seo-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install photo conversion library
        if: ${{ !contains(github.event.head_commit.message, '[regional-only]') }}
        run: python3 -m pip install Pillow==12.3.0
      - name: Import verified course photographs
        if: ${{ !contains(github.event.head_commit.message, '[regional-only]') }}
        run: node scripts/import-course-photos.mjs
      - name: Generate static search pages
        env:
          REGIONAL_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[regional-only]') }}
        run: |
          if [ "$REGIONAL_ONLY" = "true" ]; then
            node scripts/refine-regional-search.mjs
          else
            node scripts/generate-seo.mjs
          fi
      - name: Check deployment size and public file boundaries
        run: node --test tests/pages-storage.mjs tests/photo-storage-guard.mjs && node scripts/audit-pages-storage.mjs
      - name: Validate public page and image discovery
        env:
          REQUIRE_GENERATED_REGION_META: '1'
        run: node --test tests/pet-care-region-meta.mjs tests/guide-topics.mjs tests/guide-discovery.mjs tests/regional-search.mjs tests/route-guide-comparison.mjs tests/image-metadata.mjs tests/sitemap-modified.mjs tests/route-evidence-guides.mjs tests/place-quality11.mjs tests/place-experience11.mjs tests/place-quality10.mjs tests/search-partitions.cjs tests/place-quality9.mjs tests/place-quality8.mjs tests/place-quality8-data.cjs tests/place-quality7.mjs tests/place-quality6.mjs tests/cards-quality5.mjs tests/detail-editorial.mjs tests/place-quality3.mjs tests/detail-gallery-runtime.mjs tests/detail-photo-delivery.mjs tests/search-discovery.mjs tests/image-sitemap.mjs tests/search-markup.mjs tests/place-enrichment.cjs tests/place-detail-layout.mjs tests/place-gallery.cjs tests/place-bulk-match.cjs tests/place-visit-info.cjs tests/place-photo-rights.cjs tests/place-cultural-data.cjs
      - name: Validate home place sections
        run: node tests/home-places.cjs && node tests/home-more.cjs && node tests/home-scenes.cjs
      - name: Validate public directory layout and sorting
        run: node --test tests/public-design.mjs tests/place-search.cjs
      - name: Validate weather and affiliate cards
        run: node tests/weather-widget.cjs && node tests/shopping.cjs && node --test tests/weather-snapshot.mjs
      - name: Commit changed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pet-life pet-care courses places bins guides weekend with-dog discover.html sitemap.xml rss.xml index.html assets/course-photos assets/search-styles assets/search-data course-photos.js
          if git diff --cached --quiet; then
            echo "No SEO page changes"
          else
            git commit -m "검색용 상세 페이지 자동 갱신"
            # Generator side effects outside the published allowlist can leave
            # tracked files dirty and cause git rebase to fail. The intended
            # public artifacts are already committed above; keep the discard
            # explicit and visible in the Actions log before rebasing.
            if ! git diff --quiet; then
              echo "::notice::Discarding unstaged generator changes outside the publish allowlist"
              git diff --name-only
              git restore --worktree .
            fi
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
