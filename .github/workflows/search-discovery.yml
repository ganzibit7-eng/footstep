name: Notify search engines after deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'weekend/**', 'share-link.js', 'courses/**', 'places/**', 'bins/**', 'guides/**', 'with-dog/**', 'sitemap.xml', 'walk-sitemap.xml', 'scripts/search-discovery.mjs', '.github/workflows/search-discovery.yml']
  workflow_run:
    workflows: ['pages build and deployment', 'Generate SEO pages']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
concurrency:
  group: indexnow-main
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.name == 'Generate SEO pages' && 'main' || github.event.workflow_run.head_sha || github.sha }}
      - name: Publish generated pages only when missing from the live deployment
        if: github.event.workflow_run.name == 'Generate SEO pages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(git rev-parse HEAD)
          published=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.commit + " " + .status')
          if [ "$published" != "$expected built" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
      - name: Wait for this commit to finish Pages deployment
        if: github.event_name != 'workflow_run' || github.event.workflow_run.name == 'Generate SEO pages'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(git rev-parse HEAD)
          for attempt in $(seq 1 60); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$expected&per_page=30" --jq '.workflow_runs[] | select(.name == "pages build and deployment") | .conclusion // "pending"' | head -n 1)
            if [ "$result" = "success" ]; then exit 0; fi
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then echo "Pages deployment did not succeed"; exit 1; fi
            sleep 10
          done
          echo "Pages deployment not confirmed; no search notifications sent"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: .search-state
          key: indexnow-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-main-
      - name: Validate sitemap pages and notify only changed public URLs
        run: |
          node --test tests/search-discovery.mjs
          node scripts/search-discovery.mjs --submit
      - uses: actions/cache/save@v4
        with:
          path: .search-state
          key: indexnow-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record result
        run: echo 'IndexNow receipt is not proof of indexing, ranking or visitor growth. Only changed public canonical pages are submitted.' >> "$GITHUB_STEP_SUMMARY"
